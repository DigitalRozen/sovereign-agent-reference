[project]
name = "mcp-erp"
version = "0.1.0"
description = "MCP tool server over the AI data layer of a fictional ERP, with per-tool authorization."
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
