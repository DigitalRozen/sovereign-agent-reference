apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
  - keycloak/deployment.yaml
  - scripted-llm/deployment.yaml
  - litellm/deployment.yaml
  - litellm/key-bootstrap-job.yaml
  - mcp-erp/deployment.yaml
  - sandbox/network-policy.yaml
  - sandbox/runner.yaml
  - agent-api/deployment.yaml

# Init scripts run once, on first start of an empty data volume.
# After editing them, recreate the cluster: make down up
configMapGenerator:
  - name: postgres-init
    namespace: platform
    files:
      - postgres/init/01-roles.sh
      - postgres/init/02-schema.sql
      - postgres/init/03-seed.sql
  - name: keycloak-realm
    namespace: platform
    files:
      - keycloak/realm-tarnwick.json
  - name: litellm-config
    namespace: platform
    files:
      - litellm/config.yaml
