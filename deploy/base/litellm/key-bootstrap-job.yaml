# Registers one virtual key per demo user, with that user's budget and rate limit.
# The key values are generated by scripts/up.sh and stored only in the llm-keys Secret.
# Idempotent: keys that already exist are left unchanged.
apiVersion: batch/v1
kind: Job
metadata:
  name: llm-key-bootstrap
  namespace: platform
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: bootstrap
          image: curlimages/curl:8.20.0
          env:
            - name: MASTER_KEY
              valueFrom: { secretKeyRef: { name: llm-keys, key: master-key } }
            - name: KEY_ALICE
              valueFrom: { secretKeyRef: { name: llm-keys, key: user-key-alice } }
            - name: KEY_MORGAN
              valueFrom: { secretKeyRef: { name: llm-keys, key: user-key-morgan } }
            - name: KEY_VAL
              valueFrom: { secretKeyRef: { name: llm-keys, key: user-key-val } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              GW=http://litellm.platform.svc.cluster.local:4000

              register() {
                user="$1"; key="$2"; budget="$3"; rpm="$4"
                if curl -fs -o /dev/null -H "Authorization: Bearer $MASTER_KEY" \
                     "$GW/key/info?key=$key"; then
                  echo "key for $user already registered"
                  return
                fi
                curl -fsS -H "Authorization: Bearer $MASTER_KEY" -H "Content-Type: application/json" \
                  "$GW/key/generate" -d "{
                    \"key\": \"$key\",
                    \"key_alias\": \"user-$user\",
                    \"user_id\": \"$user\",
                    \"models\": [\"agent-default\", \"agent-openrouter\"],
                    \"max_budget\": $budget,
                    \"budget_duration\": \"30d\",
                    \"rpm_limit\": $rpm,
                    \"metadata\": {\"cost_center\": \"procurement\"}
                  }" >/dev/null
                echo "registered key for $user (budget USD $budget per 30d, $rpm rpm)"
              }

              register alice  "$KEY_ALICE"  1.00 30
              register morgan "$KEY_MORGAN" 1.00 30
              register val    "$KEY_VAL"    0.05 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # The image declares a named user, which the kubelet cannot verify as non-root.
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: { drop: ["ALL"] }
