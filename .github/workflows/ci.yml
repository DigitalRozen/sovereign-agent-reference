name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: make lint
      - run: make test

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --redact --verbose --exit-code 1

  k3d-smoke:
    runs-on: ubuntu-latest
    env:
      K3D_VERSION: v5.8.3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Install k3d
        run: |
          sudo curl -fsSL -o /usr/local/bin/k3d \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          sudo chmod +x /usr/local/bin/k3d
          k3d version
      # Private-repo runners start with about 12 GB free, below what make doctor
      # requires for the images. Remove unused toolchains first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - run: make doctor
      - run: make up
      - run: make smoke
      # The commands used in docs/demo-script.md, run once on the same cluster.
      - run: make creds > /dev/null
      - run: time make demo
      - run: time make audit
      - name: make reset-demo, then the demo starts again from draft 1
        run: |
          time make reset-demo
          make demo | tee demo.txt
          grep -q 'Drafted purchase order #1 for' demo.txt
      # The WSL2 failure: make up on an existing cluster kept the old sandbox-runner pod
      # (fixed ":dev" tag, "unchanged" Deployment), so sandbox runs lacked the network guard.
      - name: make up after a code change rolls new service pods
        run: |
          image() { kubectl -n platform get deploy sandbox-runner -o jsonpath='{.spec.template.spec.containers[0].image}'; }
          before="$(image)"
          echo "# changed in CI" >> services/sandbox_runner/sandbox_runner/__init__.py
          make up
          after="$(image)"
          echo "sandbox-runner: $before -> $after"
          test "$before" != "$after"
          make doctor | tee doctor.txt
          grep -q "service pods run this checkout's images" doctor.txt
          grep -q "deny-all selects every sandbox pod" doctor.txt
          grep -q "NetworkPolicy enforced" doctor.txt
          uv run pytest -q -m cluster tests/cluster/test_sandbox.py
          git checkout -- services/sandbox_runner/sandbox_runner/__init__.py
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n platform logs statefulset/postgres --tail=100
          kubectl -n platform logs deployment/keycloak --tail=100
          kubectl -n platform logs deployment/litellm --tail=100
          kubectl -n platform logs job/llm-key-bootstrap --tail=50
          kubectl -n platform logs deployment/mcp-erp --tail=100
          kubectl -n platform logs deployment/sandbox-runner --tail=100
          kubectl -n sandbox get jobs,pods
          kubectl -n platform logs deployment/agent-api --tail=100
      - run: make down
